<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Her Lore — Birthday Quiz</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131e30;
        --panel2: #1b2940;
        --line: #2d3c56;
        --text: #f6f7fb;
        --muted: #aab7cc;
        --pink: #f472b6;
        --pink2: #fb9bcf;
        --green: #6ee7b7;
        --red: #fda4af;
        --gold: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(ellipse at top, #19263d 0, #0b1220 55%);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        min-height: 100vh;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 14px;
        padding: 13px 16px;
        font-weight: 750;
        transition:
          transform 0.12s,
          opacity 0.12s;
      }

      button:active {
        transform: scale(0.985);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .primary {
        background: linear-gradient(135deg, var(--pink), var(--pink2));
        color: #241021;
      }

      .secondary {
        background: transparent;
        border: 1px solid #7184a5;
        color: var(--text);
      }

      .quiet {
        background: transparent;
        color: var(--muted);
        padding: 8px;
      }

      .wrap {
        max-width: 760px;
        margin: auto;
        padding: 22px 16px 56px;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .logo {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        background: var(--pink);
        display: grid;
        place-items: center;
        color: #241021;
        font-size: 24px;
      }

      .brand {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .subbrand {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }

      .pill {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 10px;
        color: #f9a8d4;
        font-size: 12px;
      }

      .card {
        background: linear-gradient(
          145deg,
          rgba(24, 37, 58, 0.98),
          rgba(17, 27, 43, 0.98)
        );
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 18px 45px #0002;
      }

      .hero {
        text-align: center;
        padding: 32px 18px;
      }

      .heart {
        font-size: 55px;
        color: var(--pink);
        line-height: 1;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--pink);
        font-size: 11px;
        font-weight: 800;
      }

      h1 {
        font-size: clamp(30px, 7vw, 46px);
        line-height: 1.08;
        margin: 12px 0;
      }

      h2 {
        font-size: 25px;
        margin: 8px 0 12px;
      }

      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }

      p {
        line-height: 1.55;
        color: var(--muted);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }

      .small {
        font-size: 12px;
        color: var(--muted);
      }

      .field {
        display: grid;
        gap: 7px;
        margin: 14px 0;
      }

      .field label {
        font-size: 13px;
        font-weight: 750;
        color: #dce4f2;
      }

      input,
      textarea,
      select {
        width: 100%;
        background: #0c1626;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 13px;
        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--pink);
      }

      textarea {
        resize: vertical;
        min-height: 86px;
      }

      .options {
        display: grid;
        gap: 10px;
        margin: 20px 0;
      }

      .option {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        background: #1b2940;
        border: 1px solid #2b3b54;
        color: var(--text);
        padding: 14px;
        border-radius: 15px;
      }

      .letter {
        display: grid;
        place-items: center;
        flex: 0 0 32px;
        height: 32px;
        border-radius: 10px;
        background: #2a3b55;
        color: #fff;
      }

      .option.selected {
        border-color: var(--pink);
        background: #39253e;
      }

      .option.correct {
        border-color: var(--green);
        background: #123c35;
      }

      .option.wrong {
        border-color: var(--red);
        background: #482834;
      }

      .bar {
        height: 6px;
        background: #2a3850;
        border-radius: 20px;
        overflow: hidden;
        margin: 12px 0 22px;
      }

      .bar span {
        display: block;
        height: 100%;
        background: var(--pink);
        transition: width 0.2s;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .row > * {
        flex: 1;
      }

      .fact {
        border: 1px solid var(--line);
        background: #101b2c;
        border-radius: 16px;
        padding: 15px;
        margin: 10px 0;
      }

      .facttop {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .answerkey {
        color: var(--green);
        font-size: 13px;
      }

      .notice {
        border: 1px solid #58445d;
        background: #2a2036;
        color: #f5d8ed;
        border-radius: 14px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      .score {
        font-size: 58px;
        font-weight: 900;
        color: var(--pink);
        line-height: 1.1;
      }

      .hidden {
        display: none !important;
      }

      .footer {
        text-align: center;
        color: #687b99;
        font-size: 11px;
        margin-top: 18px;
      }

      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #e8fff5;
        color: #10392e;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 750;
        box-shadow: 0 8px 30px #0004;
        z-index: 5;
      }

      .card:has(.arena-artifact) { position:relative; }
      .arena-artifact-wrap { position:absolute; z-index:3; width:27px; height:27px; opacity:.58; transition:opacity .15s ease; }
      .arena-artifact-wrap:hover { opacity:1; }
      .arena-artifact { position:relative; display:grid; place-items:center; width:32px; height:32px; border:0; border-radius:50%; padding:0; overflow:hidden; cursor:pointer; background:transparent; box-shadow:0 3px 9px #0005; transition:transform .12s ease,filter .12s ease; }
      .arena-artifact:hover { transform:translateY(-3px) rotate(-2deg); filter:brightness(1.2); }
      .arena-artifact img { display:block; width:100%; height:100%; object-fit:cover; border-radius:50%; border:1px solid #ffffffaa; }
      .arena-artifact.destroying { animation:arenaSmash .45s ease-in forwards; pointer-events:none; }
      @keyframes arenaSmash { 0%{transform:scale(1) rotate(0)} 25%{transform:scale(1.15) rotate(-8deg)} 55%{transform:scale(.8) rotate(9deg);filter:brightness(2)} 100%{transform:scale(0) rotate(35deg);opacity:0} }
      .artifact-sparks { position:absolute; inset:-12px; pointer-events:none; font-size:17px; animation:sparkBurst .5s ease-out forwards; }
      @keyframes sparkBurst { from{transform:scale(.25);opacity:1} to{transform:scale(1.8) translateY(-12px);opacity:0} }
      .modal { position:fixed; inset:0; z-index:50; background:#050914eF; display:grid; place-items:center; padding:20px; }
      .modal-card { position:relative; max-width:560px; width:100%; background:transparent; border:0; border-radius:22px; padding:0; }
      .modal-card .row { position:absolute; top:8px; right:8px; z-index:2; }
      .modal-card .row h2 { display:none; }
      .modal-card .row button { min-width:36px; width:36px; height:36px; padding:0; border-radius:50%; background:#111a; color:white; border:1px solid #fff7; font-size:0; }
      .modal-card .row button:after { content:"×"; font-size:25px; line-height:1; }
      .modal-card img { display:block; width:100%; max-height:82vh; object-fit:contain; border-radius:14px; box-shadow:0 18px 70px #0008; }
      #artifactCaption { display:none; }
      .happy-runaway {
        position: fixed;
        z-index: 20;
        white-space: nowrap;
        transition:
          left 0.18s ease,
          top 0.18s ease,
          width 0.18s ease,
          padding 0.18s ease,
          font-size 0.18s ease;
        max-width: calc(100vw - 12px);
      }

      @media (min-width: 600px) {
        .actions.two {
          grid-template-columns: 1fr 1fr;
        }

        .card {
          padding: 26px;
        }

        .hero {
          padding: 44px 32px;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header class="top">
        <div class="logo">♡</div>
        <div>
          <div class="brand">HER LORE</div>
          <div class="subbrand">The birthday quiz</div>
        </div>
        <div class="pill" id="countPill">0 questions</div>
      </header>
      <main id="app"></main>
      <div class="footer">
        Made for one birthday girl. Best enjoyed with friends' receipts.
      </div>
    </div>
    <div id="toast" class="toast hidden"></div><div id="artifactModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="row"><h2 id="artifactTitle"></h2><button class="secondary" data-action="close-artifact" aria-label="Close image">Close</button></div><img id="artifactImage" alt="A photo memory"></div></div>
    <script>
      const KEY = "her-lore-questions-v2";
const allPeople = [
  "Derek",
  "Elaine",
  "Erin",
  "Hailey",
  "James",
  "Jenn",
  "Kam",
  "Kat",
  "Kelvin",
  "Leon",
  "Margaret",
  "Meaghan",
  "Nicole",
  "Sara",
  "Sarina",
  "Scully"
];

const starter = [
  {
    id: 1,
    type: "truthlie",
    from: "Leon",
    question: "Two truths and a lie about Sarah",
    options: [
      "I am your eldest son",
      "We went to a bbno$ concert",
      "I am stronger than you"
    ],
    correct: 3
  },
  {
    id: 2,
    type: "who_said",
    from: "Leon",
    question: "What's the most embarrassing thing you've witnessed Jackie do?",
    answer: "Nothing - she is perfect 24/7, 365 🤩",
    people: allPeople,
    correctPerson: "Leon"
  },
  {
    id: 3,
    type: "who_said",
    from: "Leon",
    question: "What's the weirdest thing Jackie has ever said to you?",
    answer: "Do a Hitler salute 🫡",
    correctPerson: "Leon"
  },
  {
    id: 4,
    type: "who_said",
    from: "Leon",
    question: "What's your favorite memory with Jackie?",
    answer: "Welland 2023 - she looked so proud 🥹",
    people: allPeople,
    correctPerson: "Leon"
  },
    {
    id: 4,
    type: "who_said",
    from: "Leon",
    question: "What's your favorite memory with Jackie?",
    answer: "Welland 2023 - she looked so proud 🥹",
    people: allPeople,
    correctPerson: "Leon"
  } ,
  {
    id: 5,
    type: "who_said",
    from: "Leon",
    question: "What's something Jackie did for you that you'll never forget?",
    answer: "Held me as I suffered through a calf cramp 😭",
    people: allPeople,
    correctPerson: "Leon"
  }
];
      let questions = loadQuestions(),
        usedArtifacts = new Set(),
        answers = {},
        index = 0,
        revealed = false,
        screen = "home",
        lastScore = null,
        happyClicks = 0,
        whoChoices = {},
        playQuestions = [];
      function loadQuestions() {
        try {
          const x = JSON.parse(localStorage.getItem(KEY));
          return Array.isArray(x) ? x : starter.slice();
        } catch {
          return starter.slice();
        }
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(questions));
        document.getElementById("countPill").textContent =
          questions.length + " question" + (questions.length === 1 ? "" : "s");
      }
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function btn(label, action, cls = "primary", disabled = false) {
        return `<button class="${cls}" data-action="${action}" ${disabled ? "disabled" : ""}>${label}</button>`;
      }
      function makeWhoChoices(q) {
        const people = Array.from(new Set([...(q.people || []), q.correctPerson].filter(Boolean)));
        const others = people.filter((p) => p !== q.correctPerson).sort(() => Math.random() - 0.5).slice(0, 2);
        return [...others, q.correctPerson].sort(() => Math.random() - 0.5);
      }
    const artifactImages = [
      "images/IMG-20260314-WA0018.jpg",
      "images/IMG-20260405-WA0004.jpg",
      "images/IMG-20260513-WA0018.jpg",
      "images/IMG-20260513-WA0019.jpg",
      "images/IMG-20260513-WA0020.jpg",
      "images/IMG-20260513-WA0021.jpg",
      "images/IMG-20260728-WA0004.jpg",
      "images/IMG-20260804-WA0008.jpg",
      "images/IMG-20260804-WA0019.jpg",
      "images/IMG-20260823-WA0008.jpg",
      "images/IMG-20260830-WA0001.jpg",
      "images/IMG-20260908-WA0010.jpg",
      "images/IMG-20260909-WA0003.jpg",
      "images/IMG-20260909-WA0004.jpg",
      "images/IMG-20260909-WA0006.jpg",
      "images/IMG-20260909-WA0008.jpg",
      "images/IMG-20260909-WA0009.jpg",
      "images/IMG-20260909-WA0015.jpg",
      "images/IMG-20260909-WA0016.jpg",
      "images/IMG-20260914-WA0046.jpg",
      "images/IMG-20260914-WA0047.jpg",
      "images/IMG-20260914-WA0049.jpg",
      "images/IMG-20260925-WA0004.jpg",
      "images/IMG-20260926-WA0014.jpg",
      "images/IMG-20261012-WA0000.jpg",
      "images/pic1.jpg",
      "images/pic2.jpg",
      "images/pic3.jpg",
      "images/pic4.jpg",
      "images/PXL_20260903_091150833.MP.jpg",
      "images/PXL_20260903_091217319.jpg",
      "images/PXL_20260904_073751457.jpg"
    ];
      const catImage = "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=160&q=80";
      function pickRandomHalf() {
        const shuffled = [...questions].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.max(1, Math.ceil(shuffled.length / 2)));
      }
      function openArtifact() {
        const image = document.getElementById("artifactImage");
        image.src = artifactImages[Math.floor(Math.random() * artifactImages.length)];
        image.alt = "A randomly revealed photo memory";
        document.getElementById("artifactModal").classList.remove("hidden");
      }
      function randomArtifactPosition() {
        const spots = [
          { left: "8%", top: "18%" }, { right: "8%", top: "17%" },
          { left: "5%", top: "48%" }, { right: "5%", top: "48%" },
          { left: "12%", bottom: "8%" }, { right: "12%", bottom: "8%" },
          { left: "48%", top: "12%" }, { left: "78%", bottom: "18%" }
        ];
        return spots[Math.floor(Math.random() * spots.length)];
      }
      function render() {
        save();
        const app = document.getElementById("app");
        if (screen === "home") {
          app.innerHTML = `<section class="card hero"><div class="heart">♡</div><div class="eyebrow">Birthday edition</div><h1>Choose your destiny</h1><p>Two truths and a lie. Friends' receipts. Questionable memories. How well do you really know your people?</p><div class="actions two">${btn("Ragebait me 😈 →", "start")}<button class="secondary" id="happyPathButton" data-action="happy">Happy path 😇</button></div><p class="small" id="happyHint">Choose wisely. One of these options is lying to you.</p></section>`;
        }
        if (screen === "add") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><div class="eyebrow">Friend submission</div><h2>Add a question about her</h2><p>Make it funny, specific, sweet, or slightly embarrassing. She will answer it herself.</p><form id="factForm"><div class="field"><label>Your name or nickname</label><input name="from" placeholder="e.g. Sarah" required maxlength="50"></div><div class="field"><label>Question</label><textarea name="question" placeholder="e.g. What's her most irrational fear?" required maxlength="240"></textarea></div><h3>Answer options</h3>${[0, 1, 2, 3].map((i) => `<div class="field"><label>Option ${"ABCD"[i]}</label><input name="opt${i}" placeholder="${["First answer", "Second answer", "Third answer", "Fourth answer"][i]}" required maxlength="120"></div>`).join("")}<div class="field"><label>Which answer is correct?</label><select name="correct">${["A", "B", "C", "D"].map((v, i) => `<option value="${i}">${v}</option>`).join("")}</select></div><div class="field"><label>Story / explanation (optional)</label><textarea name="explanation" placeholder="Add context to reveal after she answers." maxlength="400"></textarea></div><button class="primary" type="submit">Add to this quiz</button></form><p class="small">Prototype note: this saves to the current browser only, not to a shared link.</p></section>`;
        }
        if (screen === "play") {
          if (!playQuestions.length) {
            app.innerHTML = `<section class="card"><h2>No questions yet</h2><p>Ask friends to submit some first.</p>${btn("Add a question", "add")}${btn("Home", "home", "secondary")}</section>`;
            return;
          }
          if (index >= playQuestions.length) {
            const score = playQuestions.reduce(
              (n, q, i) => n + (answers[i] === (q.type === "who_said" ? (whoChoices[i] || []).indexOf(q.correctPerson) : q.correct) ? 1 : 0),
              0,
            );
            lastScore = score;
            app.innerHTML = `<section class="card hero"><div class="heart">🏆</div><div class="eyebrow">That's a wrap</div><h1>Your results</h1><div class="score">${score}<span style="font-size:23px;color:var(--muted)"> / ${playQuestions.length}</span></div><p>${score === playQuestions.length ? "Perfect score. Your friends have been exposed." : score >= Math.ceil(playQuestions.length * 0.7) ? "Not bad! Your friends have a few surprises for you." : "Your friends might know a few things you didn’t expect."}</p><div class="actions">${btn("Play again", "restart", "secondary")}${btn("Home", "home", "quiet")}</div></section>`;
            return;
          }
          const q = playQuestions[index],
            chosen = answers[index],
            isWho = q.type === "who_said",
            choices = isWho ? (whoChoices[index] || makeWhoChoices(q)) : q.options,
            correctIndex = isWho ? choices.indexOf(q.correctPerson) : q.correct;
          if (isWho) whoChoices[index] = choices;
          const prompt = isWho ? q.question : `${q.from}: two truths and a lie`;
          const subPrompt = isWho ? `Someone answered this prompt: “${q.answer}” Who said it?` : "Which statement is the lie?";
          app.innerHTML = `<section class="card"><div class="row"><button class="quiet" data-action="home">✕ Exit</button><span style="text-align:right;color:var(--muted);font-size:12px">QUESTION ${index + 1} OF ${playQuestions.length}</span></div><div class="bar"><span style="width:${((index + 1) / playQuestions.length) * 100}%"></span></div><div class="eyebrow">${isWho ? "Who said it?" : "Two truths and a lie"}</div><h2>${esc(prompt)}</h2><p>${esc(subPrompt)}</p><div class="options">${choices.map((o, i) => `<button class="option ${chosen === i ? "selected" : ""} ${revealed && i === correctIndex ? "correct" : ""} ${revealed && chosen === i && i !== correctIndex ? "wrong" : ""}" data-answer="${i}" ${revealed ? "disabled" : ""}><span class="letter">${"ABC"[i]}</span><span>${esc(o)}</span>${revealed && i === correctIndex ? " ✓" : ""}</button>`).join("")}</div>${revealed ? `<div class="fact"><h3 style="color:${chosen === correctIndex ? "var(--green)" : "var(--red)"}">${chosen === correctIndex ? "Correct! 🎉" : "Not quite!"}</h3><p>${esc(q.explanation || "")}</p><div class="facttop"><span>${isWho ? "Answer from " + esc(q.correctPerson) : "Submitted by " + esc(q.from)}</span><span>Correct: ${esc(choices[correctIndex] || "Not set")}</span></div></div>${btn(index === playQuestions.length - 1 ? "See my results →" : "Next question →", "next")}` : btn("Lock in my answer", "reveal", "primary", chosen === undefined)}${usedArtifacts.has(index) ? "" : `<div class="arena-artifact-wrap" data-artifact-wrap><button class="arena-artifact" data-arena-artifact aria-label="Pet the hidden cat"><img src="${catImage}" alt=""></button></div>`}</section>`;
          const artifactWrap = app.querySelector("[data-artifact-wrap]");
          if (artifactWrap) Object.assign(artifactWrap.style, randomArtifactPosition());
        }
        if (screen === "manage") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><h2>Question collection</h2><p>Review the questions before birthday mode. Starter questions are examples; edit or delete them before sharing.</p>${questions.length ? questions.map((q, i) => `<div class="fact"><div class="facttop"><span>${i + 1}. From ${esc(q.from)}</span><button class="quiet" data-delete="${q.id}">Delete</button></div><h3>${esc(q.question)}</h3><p>${q.options.map((o, j) => `${"ABCD"[j]}. ${esc(o)}${j === q.correct ? " ✓" : ""}`).join("<br>")}</p><div class="answerkey">Correct: ${esc(q.options[q.correct])}</div><button class="secondary" data-edit="${q.id}" style="margin-top:10px">Edit question</button></div>`).join("") : "<p>No questions submitted yet.</p>"}<div class="actions two">${btn("+ Add a question", "add")}${btn("Preview birthday quiz", "start", "secondary")}</div><button class="quiet" data-action="export">Export questions as JSON</button><div class="field"><label>Import a question backup (JSON)</label><input type="file" id="importFile" accept=".json,application/json"></div><button class="secondary" data-action="reset">Reset to sample questions</button></section>`;
        }
        if (screen === "results") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><h2>Answer review</h2><p>Here are the answers and the friends behind them.</p>${questions.map((q, i) => `<div class="fact"><div class="facttop"><span>QUESTION ${i + 1}</span><span style="color:${answers[i] === q.correct ? "var(--green)" : "var(--red)"}">${answers[i] === q.correct ? "Correct" : "Missed"}</span></div><h3>${esc(q.question)}</h3><p>Your answer: ${answers[i] === undefined ? "Not answered" : esc(q.options[answers[i]])}</p><div class="answerkey">Correct answer: ${esc(q.options[q.correct])}</div><p>${esc(q.explanation || "")}</p><div class="facttop"><span>From ${esc(q.from)}</span></div></div>`).join("")}${btn("Play again", "restart")}${btn("Home", "home", "secondary")}</section>`;
        }
      }
      function toast(s) {
        const t = document.getElementById("toast");
        t.textContent = s;
        t.classList.remove("hidden");
        setTimeout(() => t.classList.add("hidden"), 2200);
      }
      document.addEventListener("click", (e) => {
        const artifact = e.target.closest("[data-arena-artifact]");
        if (artifact) {
          usedArtifacts.add(index);
          artifact.classList.add("destroying");
          const sparks = document.createElement("span");
          sparks.className = "artifact-sparks"; sparks.textContent = "💥 ✨ 💎";
          artifact.appendChild(sparks);
          setTimeout(() => { openArtifact(); render(); }, 320);
          return;
        }
        if (e.target.id === "artifactModal") { e.target.classList.add("hidden"); return; }
        const a = e.target.closest("[data-action]");
        if (a) {
          const x = a.dataset.action;
          if (x === "happy") {
            happyClicks++;
            const b = document.getElementById("happyPathButton"),
              hint = document.getElementById("happyHint");
            if (happyClicks >= 8) {
              if (b) b.remove();
              if (hint)
                hint.textContent =
                  "The happy path has left the chat. There is only rage now. 😈";
              return;
            }
            if (b) {
              const maxX = Math.max(6, window.innerWidth - b.offsetWidth - 6),
                maxY = Math.max(6, window.innerHeight - b.offsetHeight - 6);
              const spots = [
                [0.08, 0.18],
                [0.66, 0.14],
                [0.42, 0.78],
                [0.76, 0.55],
                [0.12, 0.67],
                [0.52, 0.3],
                [0.28, 0.48],
              ];
              const spot = spots[(happyClicks - 1) % spots.length];
              b.style.left = Math.round(maxX * spot[0]) + "px";
              b.style.top = Math.round(maxY * spot[1]) + "px";
              b.style.width =
                Math.max(42, 180 * Math.pow(0.72, happyClicks)) + "px";
              b.style.padding =
                Math.max(2, 13 * Math.pow(0.78, happyClicks)) + "px";
              b.style.fontSize =
                Math.max(5, 16 * Math.pow(0.78, happyClicks)) + "px";
              b.classList.add("happy-runaway");
              // b.textContent =
              //   happyClicks >= 6
              //     ? "😇"
              //     : `Happy path (${8 - happyClicks} chances left)`;
            }
            if (hint)
              hint.textContent =
                "It gets smaller every time. You can stop whenever you want. (You will not.)";
            return;
          }
          if (x === "close-artifact") { document.getElementById("artifactModal").classList.add("hidden"); return; }
          if (x === "home") screen = "home";
          if (x === "add") screen = "add";
          if (x === "manage") screen = "manage";
          if (x === "start") {
            happyClicks = 0;
            index = 0;
            playQuestions = pickRandomHalf();
            answers = {};
            whoChoices = {};
            usedArtifacts = new Set();
            revealed = false;
            screen = "play";
          }
          if (x === "reveal") {
            if (answers[index] === undefined) return;
            revealed = true;
          }
          if (x === "next") {
            index++;
            revealed = false;
          }
          if (x === "restart") {
            index = 0;
            playQuestions = pickRandomHalf();
            answers = {};
            whoChoices = {};
            usedArtifacts = new Set();
            revealed = false;
            screen = "play";
          }
          if (x === "results") screen = "results";
          if (x === "reset") {
            if (confirm("Replace your collection with sample questions?")) {
              questions = starter.map((q) => ({ ...q }));
              answers = {};
              save();
              toast("Sample questions restored");
            }
          }
          if (x === "export") {
            const blob = new Blob([JSON.stringify(questions, null, 2)], {
                type: "application/json",
              }),
              url = URL.createObjectURL(blob),
              link = document.createElement("a");
            link.href = url;
            link.download = "her-lore-questions.json";
            link.click();
            URL.revokeObjectURL(url);
          }
          render();
          return;
        }
        const opt = e.target.closest("[data-answer]");
        if (opt && !revealed) {
          answers[index] = Number(opt.dataset.answer);
          render();
          return;
        }
        const del = e.target.closest("[data-delete]");
        if (del) {
          questions = questions.filter(
            (q) => String(q.id) !== del.dataset.delete,
          );
          answers = {};
          index = 0;
          save();
          render();
          return;
        }
        const edit = e.target.closest("[data-edit]");
        if (edit) {
          const q = questions.find((q) => String(q.id) === edit.dataset.edit);
          if (!q) return;
          const question = prompt("Edit question", q.question);
          if (question === null) return;
          q.question = question;
          const from = prompt("Submitted by", q.from);
          if (from !== null) q.from = from;
          for (let i = 0; i < 4; i++) {
            const v = prompt("Option " + "ABCD"[i], q.options[i]);
            if (v !== null) q.options[i] = v;
          }
          const c = prompt(
            "Correct answer: enter A, B, C or D",
            "ABCD"[q.correct],
          );
          if (c && "ABCD".includes(c.toUpperCase()))
            q.correct = "ABCD".indexOf(c.toUpperCase());
          const ex = prompt("Explanation", q.explanation || "");
          if (ex !== null) q.explanation = ex;
          save();
          render();
          return;
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id !== "factForm") return;
        e.preventDefault();
        const f = new FormData(e.target),
          q = {
            id: Date.now(),
            from: String(f.get("from")).trim(),
            question: String(f.get("question")).trim(),
            options: [0, 1, 2, 3].map((i) => String(f.get("opt" + i)).trim()),
            correct: Number(f.get("correct")),
            explanation: String(f.get("explanation") || "").trim(),
          };
        questions.push(q);
        save();
        screen = "manage";
        render();
        toast("Question added to this browser!");
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "importFile" && e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (
                !Array.isArray(data) ||
                data.some(
                  (q) =>
                    !q.question ||
                    !Array.isArray(q.options) ||
                    q.options.length !== 4,
                )
              )
                throw Error();
              questions = data;
              save();
              render();
              toast("Questions imported");
            } catch {
              alert("That file does not look like a Her Lore question backup.");
            }
          };
          reader.readAsText(e.target.files[0]);
        }
      });
      render();
    </script>
  </body>
</html>
