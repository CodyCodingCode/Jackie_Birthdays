      :root {
        --bg: #0b1220;
        --panel: #131e30;
        --panel2: #1b2940;
        --line: #2d3c56;
        --text: #f6f7fb;
        --muted: #aab7cc;
        --pink: #f472b6;
        --pink2: #fb9bcf;
        --green: #6ee7b7;
        --red: #fda4af;
        --gold: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

body {
  margin: 0;
  min-height: 100vh;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 110%, #35205f 0%, transparent 55%),
    radial-gradient(ellipse at 15% 15%, #24134c 0%, transparent 45%),
    radial-gradient(ellipse at 85% 20%, #172b55 0%, transparent 45%),
    #080817;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--text);
}

/* Moving concert spotlights */
body::before {
  content: "";
  position: fixed;
  inset: -30%;
  z-index: -1;
  pointer-events: none;
  background:
    linear-gradient(
      115deg,
      transparent 35%,
      rgba(244, 114, 182, 0.18) 45%,
      transparent 55%
    ),
    linear-gradient(
      245deg,
      transparent 35%,
      rgba(96, 165, 250, 0.17) 45%,
      transparent 55%
    ),
    linear-gradient(
      180deg,
      transparent 35%,
      rgba(192, 132, 252, 0.12) 50%,
      transparent 65%
    );
  filter: blur(20px);
  animation: stageLights 12s ease-in-out infinite alternate;
}

/* Tiny floating stage lights */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 2px),
    radial-gradient(circle, rgba(244,114,182,.8) 1px, transparent 2px),
    radial-gradient(circle, rgba(147,197,253,.8) 1px, transparent 2px);
  background-size: 110px 130px, 170px 190px, 230px 210px;
  background-position: 0 0, 50px 80px, 100px 30px;
  opacity: 0.35;
  animation: sparkle 5s ease-in-out infinite alternate;
}

@keyframes stageLights {
  0% {
    transform: translateX(-5%) rotate(-5deg);
  }
  50% {
    transform: translateX(4%) rotate(3deg);
  }
  100% {
    transform: translateX(-2%) rotate(-3deg);
  }
}

@keyframes sparkle {
  from { opacity: 0.15; }
  to { opacity: 0.5; }
}

@media (prefers-reduced-motion: reduce) {
  body::before,
  body::after {
    animation: none;
  }
}

        place-items: center;

        height: 32px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
        background: transparent;
        box-shadow: 0 3px 9px #0005;
        transition:

          filter 0.12s ease;
      }
      .arena-artifact:hover {
        transform: translateY(-3px) rotate(-2deg);
        filter: brightness(1.2);
      }
      .arena-artifact img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid #ffffffaa;
      }
      .arena-artifact.destroying {
        animation: arenaSmash 0.45s ease-in forwards;
        pointer-events: none;
      }
      @keyframes arenaSmash {
        0% {
          transform: scale(1) rotate(0);
        }
        25% {
          transform: scale(1.15) rotate(-8deg);
        }
        55% {
          transform: scale(0.8) rotate(9deg);
          filter: brightness(2);
        }
        100% {
          transform: scale(0) rotate(35deg);
          opacity: 0;

      let questions = loadQuestions(),

      function loadQuestions() {

      function esc(s) {
        return String(s ?? "").replace(

      function btn(label, action, cls = "primary", disabled = false) {

      const artifactImages = [

      const hiddenCatImages = [

      function getRandomHiddenImage() {
        return hiddenCatImages[
          Math.floor(Math.random() * hiddenCatImages.length)

      }
      function pickRandomHalf() {
        const shuffled = [...questions].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.max(1, Math.ceil(shuffled.length / 2)));
      }

      let shuffledArtifacts = [];
      let artifactIndex = 0;

      function openArtifact() {
        // Create a new shuffled deck when all photos have been used
        if (artifactIndex >= shuffledArtifacts.length) {
          shuffledArtifacts = [...artifactImages];

          // Fisher-Yates shuffle
          for (let i = shuffledArtifacts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledArtifacts[i], shuffledArtifacts[j]] = [
              shuffledArtifacts[j],
              shuffledArtifacts[i],
            ];
          }

          // Avoid repeating the previous deck's last photo first
          if (
            shuffledArtifacts.length > 1 &&
            shuffledArtifacts[0] === lastArtifact
          ) {
            [shuffledArtifacts[0], shuffledArtifacts[1]] = [
              shuffledArtifacts[1],
              shuffledArtifacts[0],
            ];
          }

          artifactIndex = 0;
        }

        const image = document.getElementById("artifactImage");
        lastArtifact = shuffledArtifacts[artifactIndex++];

        image.src = lastArtifact;
        image.alt = "A randomly revealed photo memory";

        document.getElementById("artifactModal").classList.remove("hidden");
      }

      let lastArtifact = null;

      function randomArtifactPosition() {
        const spots = [
          { left: "8%", top: "18%" },
          { right: "8%", top: "17%" },
          { left: "5%", top: "48%" },
          { right: "5%", top: "48%" },
          { left: "12%", bottom: "8%" },
          { right: "12%", bottom: "8%" },
          { left: "48%", top: "12%" },
          { left: "78%", bottom: "18%" },
        ];
        return spots[Math.floor(Math.random() * spots.length)];
      }
      function render() {
        save();
        const app = document.getElementById("app");
        if (screen === "home") {
          app.innerHTML = `<section class="card hero"><div class="heart">♡</div><div class="eyebrow">Birthday edition</div><h1>Choose your destiny</h1><p>Two truths and a lie. Friends' receipts. Questionable memories. How well do you really know your people?</p><div class="actions two">${btn("Ragebait me 😈 →", "start")}<button class="secondary" id="happyPathButton" data-action="happy">Happy path 😇</button></div><p class="small" id="happyHint">Choose wisely. One of these options is lying to you.</p></section>`;
        }
        if (screen === "add") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><div class="eyebrow">Friend submission</div><h2>Add a question about her</h2><p>Make it funny, specific, sweet, or slightly embarrassing. She will answer it herself.</p><form id="factForm"><div class="field"><label>Your name or nickname</label><input name="from" placeholder="e.g. Sarah" required maxlength="50"></div><div class="field"><label>Question</label><textarea name="question" placeholder="e.g. What's her most irrational fear?" required maxlength="240"></textarea></div><h3>Answer options</h3>${[0, 1, 2, 3].map((i) => `<div class="field"><label>Option ${"ABCD"[i]}</label><input name="opt${i}" placeholder="${["First answer", "Second answer", "Third answer", "Fourth answer"][i]}" required maxlength="120"></div>`).join("")}<div class="field"><label>Which answer is correct?</label><select name="correct">${["A", "B", "C", "D"].map((v, i) => `<option value="${i}">${v}</option>`).join("")}</select></div><div class="field"><label>Story / explanation (optional)</label><textarea name="explanation" placeholder="Add context to reveal after she answers." maxlength="400"></textarea></div><button class="primary" type="submit">Add to this quiz</button></form><p class="small">Prototype note: this saves to the current browser only, not to a shared link.</p></section>`;
        }
        if (screen === "play") {
          if (!playQuestions.length) {
            app.innerHTML = `<section class="card"><h2>No questions yet</h2><p>Ask friends to submit some first.</p>${btn("Add a question", "add")}${btn("Home", "home", "secondary")}</section>`;
            return;
          }
          if (index >= playQuestions.length) {
            const score = playQuestions.reduce(
              (n, q, i) =>
                n +
                (answers[i] ===
                (q.type === "who_said"
                  ? (whoChoices[i] || []).indexOf(q.correctPerson)
                  : q.correct)
                  ? 1
                  : 0),
              0,
            );
            lastScore = score;
            app.innerHTML = `<section class="card hero"><div class="heart">🏆</div><div class="eyebrow">That's a wrap</div><h1>Your results</h1><div class="score">${score}<span style="font-size:23px;color:var(--muted)"> / ${playQuestions.length}</span></div><p>${score === playQuestions.length ? "Perfect score. Your friends have been exposed." : score >= Math.ceil(playQuestions.length * 0.7) ? "Not bad! Your friends have a few surprises for you." : "Your friends might know a few things you didn’t expect."}</p><div class="actions">${btn("Play again", "restart", "secondary")}${btn("Home", "home", "quiet")}</div></section>`;
            return;
          }
          const q = playQuestions[index],
            chosen = answers[index],
            isWho = q.type === "who_said",
            choices = isWho
              ? whoChoices[index] || makeWhoChoices(q)
              : q.options,
            correctIndex = isWho ? choices.indexOf(q.correctPerson) : q.correct;
          if (isWho) whoChoices[index] = choices;
          const prompt = isWho ? q.question : `${q.from}: two truths and a lie`;
          const subPrompt = isWho
            ? `“${q.answer}”`
            : "Which statement is the lie?";
          app.innerHTML = `<section class="card"><div class="row"><button class="quiet" data-action="home">✕ Exit</button><span style="text-align:right;color:var(--muted);font-size:12px">QUESTION ${index + 1} OF ${playQuestions.length}</span></div><div class="bar"><span style="width:${((index + 1) / playQuestions.length) * 100}%"></span></div><div class="eyebrow">${isWho ? "Who said it?" : "Two truths and a lie"}</div><h2>${esc(prompt)}</h2><p>${esc(subPrompt)}</p><div class="options">${choices.map((o, i) => `<button class="option ${chosen === i ? "selected" : ""} ${revealed && i === correctIndex ? "correct" : ""} ${revealed && chosen === i && i !== correctIndex ? "wrong" : ""}" data-answer="${i}" ${revealed ? "disabled" : ""}><span class="letter">${"ABCD"[i]}</span><span>${esc(o)}</span>${revealed && i === correctIndex ? " ✓" : ""}</button>`).join("")}</div>${revealed ? `<div class="fact"><h3 style="color:${chosen === correctIndex ? "var(--green)" : "var(--red)"}">${chosen === correctIndex ? "Correct! 🎉" : "Not quite!"}</h3><p>${esc(q.explanation || "")}</p><div class="facttop"><span>${isWho ? "Answer from " + esc(q.correctPerson) : "Submitted by " + esc(q.from)}</span><span>Correct: ${esc(choices[correctIndex] || "Not set")}</span></div></div>${btn(index === playQuestions.length - 1 ? "See my results →" : "Next question →", "next")}` : btn("Lock in my answer", "reveal", "primary", chosen === undefined)}${usedArtifacts.has(index) ? "" : `<div class="arena-artifact-wrap" data-artifact-wrap><button class="arena-artifact" data-arena-artifact aria-label="Pet the hidden cat"><img src="${getRandomHiddenImage()}" alt=""></button></div>`}</section>`;
          const artifactWrap = app.querySelector("[data-artifact-wrap]");
          if (artifactWrap)
            Object.assign(artifactWrap.style, randomArtifactPosition());
        }
        if (screen === "manage") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><h2>Question collection</h2><p>Review the questions before birthday mode. Starter questions are examples; edit or delete them before sharing.</p>${questions.length ? questions.map((q, i) => `<div class="fact"><div class="facttop"><span>${i + 1}. From ${esc(q.from)}</span><button class="quiet" data-delete="${q.id}">Delete</button></div><h3>${esc(q.question)}</h3><p>${q.options.map((o, j) => `${"ABCD"[j]}. ${esc(o)}${j === q.correct ? " ✓" : ""}`).join("<br>")}</p><div class="answerkey">Correct: ${esc(q.options[q.correct])}</div><button class="secondary" data-edit="${q.id}" style="margin-top:10px">Edit question</button></div>`).join("") : "<p>No questions submitted yet.</p>"}<div class="actions two">${btn("+ Add a question", "add")}${btn("Preview birthday quiz", "start", "secondary")}</div><button class="quiet" data-action="export">Export questions as JSON</button><div class="field"><label>Import a question backup (JSON)</label><input type="file" id="importFile" accept=".json,application/json"></div><button class="secondary" data-action="reset">Reset to sample questions</button></section>`;
        }
        if (screen === "results") {
          app.innerHTML = `<section class="card"><button class="quiet" data-action="home">← Home</button><h2>Answer review</h2><p>Here are the answers and the friends behind them.</p>${questions.map((q, i) => `<div class="fact"><div class="facttop"><span>QUESTION ${i + 1}</span><span style="color:${answers[i] === q.correct ? "var(--green)" : "var(--red)"}">${answers[i] === q.correct ? "Correct" : "Missed"}</span></div><h3>${esc(q.question)}</h3><p>Your answer: ${answers[i] === undefined ? "Not answered" : esc(q.options[answers[i]])}</p><div class="answerkey">Correct answer: ${esc(q.options[q.correct])}</div><p>${esc(q.explanation || "")}</p><div class="facttop"><span>From ${esc(q.from)}</span></div></div>`).join("")}${btn("Play again", "restart")}${btn("Home", "home", "secondary")}</section>`;
        }
      }
      function toast(s) {
        const t = document.getElementById("toast");
        t.textContent = s;
        t.classList.remove("hidden");
        setTimeout(() => t.classList.add("hidden"), 2200);
      }
      document.addEventListener("click", (e) => {
        const artifact = e.target.closest("[data-arena-artifact]");
        if (artifact) {
          usedArtifacts.add(index);
          artifact.classList.add("destroying");
          const sparks = document.createElement("span");
          sparks.className = "artifact-sparks";
          sparks.textContent = "💥 ✨ 💎";
          artifact.appendChild(sparks);
          setTimeout(() => {
            openArtifact();
            render();
          }, 320);
          return;
        }
        if (e.target.id === "artifactModal") {
          e.target.classList.add("hidden");
          return;
        }
        const a = e.target.closest("[data-action]");
        if (a) {
          const x = a.dataset.action;
          if (x === "happy") {
            happyClicks++;
            const b = document.getElementById("happyPathButton"),
              hint = document.getElementById("happyHint");
            if (happyClicks >= 8) {
              if (b) b.remove();
              if (hint)
                hint.textContent =
                  "The happy path has left the chat. There is only rage now. 😈";
              return;
            }
            if (b) {
              const maxX = Math.max(6, window.innerWidth - b.offsetWidth - 6),
                maxY = Math.max(6, window.innerHeight - b.offsetHeight - 6);
              const spots = [
                [0.08, 0.18],
                [0.66, 0.14],
                [0.42, 0.78],
                [0.76, 0.55],
                [0.12, 0.67],
                [0.52, 0.3],
                [0.28, 0.48],
              ];
              const spot = spots[(happyClicks - 1) % spots.length];
              b.style.left = Math.round(maxX * spot[0]) + "px";
              b.style.top = Math.round(maxY * spot[1]) + "px";
              b.style.width =
                Math.max(42, 180 * Math.pow(0.72, happyClicks)) + "px";
              b.style.padding =
                Math.max(2, 13 * Math.pow(0.78, happyClicks)) + "px";
              b.style.fontSize =
                Math.max(5, 16 * Math.pow(0.78, happyClicks)) + "px";
              b.classList.add("happy-runaway");
              // b.textContent =
              //   happyClicks >= 6
              //     ? "😇"
              //     : `Happy path (${8 - happyClicks} chances left)`;
            }
            if (hint)
              hint.textContent =
                "It gets smaller every time. You can stop whenever you want. (You will not.)";
            return;
          }
          if (x === "close-artifact") {
            document.getElementById("artifactModal").classList.add("hidden");
            return;
          }
          if (x === "home") screen = "home";
          if (x === "add") screen = "add";
          if (x === "manage") screen = "manage";
          if (x === "start") {
            happyClicks = 0;
            index = 0;
            playQuestions = pickRandomHalf();
            answers = {};
            whoChoices = {};
            usedArtifacts = new Set();
            revealed = false;
            screen = "play";
          }
          if (x === "reveal") {
            if (answers[index] === undefined) return;
            revealed = true;
          }
          if (x === "next") {
            index++;
            revealed = false;
          }
          if (x === "restart") {
            index = 0;
            playQuestions = pickRandomHalf();
            answers = {};
            whoChoices = {};
            usedArtifacts = new Set();
            revealed = false;
            screen = "play";
          }
          if (x === "results") screen = "results";
          if (x === "reset") {
            if (confirm("Replace your collection with sample questions?")) {
              questions = starter.map((q) => ({ ...q }));
              answers = {};
              save();
              toast("Sample questions restored");
            }
          }
          if (x === "export") {
            const blob = new Blob([JSON.stringify(questions, null, 2)], {
                type: "application/json",
              }),
              url = URL.createObjectURL(blob),
              link = document.createElement("a");
            link.href = url;
            link.download = "her-lore-questions.json";
            link.click();
            URL.revokeObjectURL(url);
          }
          render();
          return;
        }
        const opt = e.target.closest("[data-answer]");
        if (opt && !revealed) {
          answers[index] = Number(opt.dataset.answer);
          render();
          return;
        }
        const del = e.target.closest("[data-delete]");
        if (del) {
          questions = questions.filter(
            (q) => String(q.id) !== del.dataset.delete,
          );
          answers = {};
          index = 0;
          save();
          render();
          return;
        }
        const edit = e.target.closest("[data-edit]");
        if (edit) {
          const q = questions.find((q) => String(q.id) === edit.dataset.edit);
          if (!q) return;
          const question = prompt("Edit question", q.question);
          if (question === null) return;
          q.question = question;
          const from = prompt("Submitted by", q.from);
          if (from !== null) q.from = from;
          for (let i = 0; i < 4; i++) {
            const v = prompt("Option " + "ABCD"[i], q.options[i]);
            if (v !== null) q.options[i] = v;
          }
          const c = prompt(
            "Correct answer: enter A, B, C or D",
            "ABCD"[q.correct],
          );
          if (c && "ABCD".includes(c.toUpperCase()))
            q.correct = "ABCD".indexOf(c.toUpperCase());
          const ex = prompt("Explanation", q.explanation || "");
          if (ex !== null) q.explanation = ex;
          save();
          render();
          return;
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id !== "factForm") return;
        e.preventDefault();
        const f = new FormData(e.target),
          q = {
            id: Date.now(),
            from: String(f.get("from")).trim(),
            question: String(f.get("question")).trim(),
            options: [0, 1, 2, 3].map((i) => String(f.get("opt" + i)).trim()),
            correct: Number(f.get("correct")),
            explanation: String(f.get("explanation") || "").trim(),
          };
        questions.push(q);
        save();
        screen = "manage";
        render();
        toast("Question added to this browser!");
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "importFile" && e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (
                !Array.isArray(data) ||
                data.some(
                  (q) =>
                    !q.question ||
                    !Array.isArray(q.options) ||
                    q.options.length !== 4,
                )
              )
                throw Error();
              questions = data;
              save();
              render();
              toast("Questions imported");
            } catch {
              alert("That file does not look like a Her Lore question backup.");
            }
          };
          reader.readAsText(e.target.files[0]);
        }
      });
      render();
    </script>
